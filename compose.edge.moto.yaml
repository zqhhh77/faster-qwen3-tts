services:
  edge-backend:
    environment:
      EDGE_TTS_PROXY: ""
    depends_on:
      - moto-relay

  moto-relay:
    image: ${TTS_IMAGE_PREFIX:-ghcr.io/zqhhh77/faster-qwen3-tts}-edge:${TTS_IMAGE_TAG:-edge}
    restart: unless-stopped
    entrypoint: ["socat", "TCP-LISTEN:443,reuseaddr,fork", "TCP:${EDGE_TTS_PROXY:?请设置 Moto 地址和端口},connect-timeout=10"]
    networks:
      default:
        aliases:
          - speech.platform.bing.com
