[project]
name = "tts-m5-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "grpcio==1.78.0",
  "protobuf==6.33.5",
  "numpy==1.26.4",
  "onnxruntime==1.23.2",
  "soundfile==0.13.1",
  "scipy==1.15.3",
  "tokenizers==0.22.1",
  "huggingface-hub==0.36.0",
  "psutil==7.2.2",
]

[project.optional-dependencies]
normalization = ["WeTextProcessing==1.3.0", "pynini==2.1.7"]

[dependency-groups]
dev = ["grpcio-tools==1.78.0", "PyYAML==6.0.3"]

[tool.uv]
package = false
