[project]
name = "tts-m5-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "grpcio==1.78.0",
  "protobuf==6.33.5",
  "numpy==1.26.4",
  "soundfile==0.13.1",
  "scipy==1.15.3",
  "tokenizers==0.22.1",
  "huggingface-hub==0.36.0",
  "psutil==7.2.2",
]

[project.optional-dependencies]
normalization = ["WeTextProcessing==1.3.0", "pynini==2.1.7"]
# ORT 1.23 的 Windows 预加载列表尚未覆盖新版 cuDNN 的 tensor_ir DLL。
cuda = ["onnxruntime-gpu[cuda,cudnn]==1.23.2", "nvidia-cudnn-cu12==9.10.2.21"]

[dependency-groups]
dev = ["grpcio-tools==1.78.0", "PyYAML==6.0.3"]
cpu = ["onnxruntime==1.23.2"]

[tool.uv]
package = false
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { extra = "cuda" }]]
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
