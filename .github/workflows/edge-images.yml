name: Edge TTS and gateway images

on:
  workflow_dispatch:
  push:
    branches: [main, feat/edge-tts]
    paths:
      - .github/workflows/edge-images.yml
      - .dockerignore
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - backend/edge/**
      - backend/m5/generated/**
      - compose.edge.yaml
      - deploy/Dockerfile.edge
      - deploy/Dockerfile.gateway

concurrency:
  group: edge-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish matched images
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in edge gateway; do
            docker buildx build --platform linux/amd64 --push \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$prefix-$service:sha-$GITHUB_SHA" \
              --file "deploy/Dockerfile.$service" .
          done
          for service in edge gateway; do
            docker buildx imagetools create --tag "$prefix-$service:edge" "$prefix-$service:sha-$GITHUB_SHA"
          done
          echo "Edge TTS + gateway ready: TTS_IMAGE_TAG=sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
